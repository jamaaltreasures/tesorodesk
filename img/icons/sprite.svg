<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Tesoro Desk utility icons. Original line art, 24px grid, 1.75 stroke, currentColor. -->
  <defs>
    <style>.s{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter}.f{fill:currentColor}.a{fill:none;stroke:#F26A3D;stroke-width:1.75;stroke-linecap:square}</style>
  </defs>
  <!-- iPhone -->
  <symbol id="i-phone" viewBox="0 0 24 24">
    <rect class="s" x="6.5" y="2.5" width="11" height="19" rx="2"/>
    <path class="s" d="M10.5 5h3"/>
    <rect class="s" x="8.75" y="7.5" width="6.5" height="10"/>
    <path class="a" d="M8.75 10.5h6.5"/>
  </symbol>
  <!-- Tap to click -->
  <symbol id="i-tap" viewBox="0 0 24 24">
    <path class="s" d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4"/>
    <path class="s" d="M10 8.5l6.5 5.2-3 .6 1.8 3.6-1.6.8-1.8-3.6-1.9 2.1z"/>
    <path class="a" d="M7.6 7.6l-1.4-1.4M10 6V4M6 10H4"/>
  </symbol>
  <!-- Live view -->
  <symbol id="i-live" viewBox="0 0 24 24">
    <rect class="s" x="2.5" y="5.5" width="19" height="13"/>
    <path class="s" d="M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3"/>
    <circle class="f" cx="9" cy="12" r="1.6" fill="#F26A3D"/>
    <path class="s" d="M12 12h4.5"/>
  </symbol>
  <!-- Stop -->
  <symbol id="i-stop" viewBox="0 0 24 24">
    <circle class="s" cx="12" cy="12" r="9"/>
    <rect class="f" x="8.5" y="8.5" width="7" height="7"/>
  </symbol>
  <!-- Network nodes -->
  <symbol id="i-link" viewBox="0 0 24 24">
    <rect class="s" x="2.5" y="3.5" width="6" height="6"/>
    <rect class="s" x="15.5" y="14.5" width="6" height="6"/>
    <path class="s" d="M5.5 9.5v8h10"/>
    <path class="a" d="M8.5 6.5h5M18.5 11.5v-5"/>
    <circle class="f" cx="18.5" cy="6.5" r="1.4"/>
  </symbol>
  <!-- Coming soon categories -->
  <symbol id="i-watch" viewBox="0 0 24 24">
    <rect class="s" x="6" y="6" width="12" height="12" rx="3"/>
    <path class="s" d="M8.5 6V2.5h7V6M8.5 18v3.5h7V18"/>
    <path class="s" d="M18 10.5h1.5"/>
  </symbol>
  <symbol id="i-mac" viewBox="0 0 24 24">
    <rect class="s" x="2.5" y="3.5" width="19" height="13"/>
    <path class="s" d="M9 20.5h6M12 16.5v4"/>
  </symbol>
  <symbol id="i-audio" viewBox="0 0 24 24">
    <path class="s" d="M3 10v4M7 7v10M11 4v16M15 8v8M19 11v2"/>
  </symbol>
  <symbol id="i-keys" viewBox="0 0 24 24">
    <rect class="s" x="2.5" y="6.5" width="19" height="11"/>
    <path class="s" d="M6 10h.5M9.5 10h.5M13 10h.5M17 10h1M7 14h10"/>
  </symbol>
  <symbol id="i-clip" viewBox="0 0 24 24">
    <path class="s" d="M8.5 4.5h-3v17h13v-17h-3"/>
    <rect class="s" x="8.5" y="2.5" width="7" height="4"/>
    <path class="s" d="M9 11.5h6M9 15.5h4"/>
  </symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24">
    <path class="s" d="M7 18.5h10.5a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.4 9.6 4.5 4.5 0 0 0 7 18.5z"/>
  </symbol>
  <symbol id="i-agents" viewBox="0 0 24 24">
    <rect class="s" x="5.5" y="7.5" width="13" height="11" rx="1"/>
    <path class="s" d="M12 7.5v-3M10 4.5h4"/>
    <path class="f" d="M9 11.5h1.75v2H9zM13.25 11.5H15v2h-1.75z"/>
    <path class="s" d="M2.5 12v3M21.5 12v3"/>
  </symbol>
  <symbol id="i-sd" viewBox="0 0 24 24">
    <path class="s" d="M6.5 2.5h8l3 3v16h-11z"/>
    <path class="s" d="M9 2.5v4M11.5 2.5v4M14 2.5v4"/>
  </symbol>
  <symbol id="i-disk" viewBox="0 0 24 24">
    <circle class="s" cx="12" cy="12" r="9"/>
    <circle class="s" cx="12" cy="12" r="2.5"/>
  </symbol>
  <!-- Bug report -->
  <symbol id="i-bug" viewBox="0 0 24 24">
    <rect class="s" x="7.5" y="7.5" width="9" height="12" rx="4.5"/>
    <path class="s" d="M9.5 7.5V6a2.5 2.5 0 0 1 5 0v1.5M12 11v8.5"/>
    <path class="a" d="M3.5 10h4M16.5 10h4M3.5 14.5h4M16.5 14.5h4"/>
  </symbol>
  <!-- Feature request -->
  <symbol id="i-spark" viewBox="0 0 24 24">
    <path class="s" d="M12 3v5M12 16v5M3 12h5M16 12h5"/>
    <path class="a" d="M6.5 6.5l2.5 2.5M15 15l2.5 2.5M17.5 6.5L15 9M9 15l-2.5 2.5"/>
    <rect class="f" x="10.5" y="10.5" width="3" height="3"/>
  </symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24">
    <path class="s" d="M4 12h15M13 6l6 6-6 6"/>
  </symbol>
</svg>
